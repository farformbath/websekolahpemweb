<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#1e3a8a" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Shield -->
  <path d="M 60 45 L 140 45 Q 140 105 100 155 Q 60 105 60 45 Z" fill="url(#shieldGrad)" />
  
  <!-- Inner Shield Border -->
  <path d="M 66 51 L 134 51 Q 134 102 100 146 Q 66 102 66 51 Z" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.8"/>

  <!-- Open Book -->
  <path d="M 100 105 Q 85 95 72 98 L 72 120 Q 85 117 100 126 Q 115 117 128 120 L 128 98 Q 115 95 100 105 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="100" y1="105" x2="100" y2="126" stroke="#1e293b" stroke-width="2"/>

  <!-- Torch / Obor Pendidikan -->
  <path d="M 96 90 L 104 90 L 102 103 L 98 103 Z" fill="url(#goldGrad)"/>
  <!-- Flame -->
  <path d="M 100 68 Q 107 76 100 87 Q 93 76 100 68 Z" fill="#ef4444"/>
  <path d="M 100 74 Q 104 79 100 86 Q 96 79 100 74 Z" fill="url(#goldGrad)"/>

  <!-- Stars -->
  <polygon points="100,32 102,38 108,38 103,42 105,48 100,44 95,48 97,42 92,38 98,38" fill="url(#goldGrad)"/>
  <polygon points="76,37 77.5,41.5 82,41.5 78.5,44.5 80,49 76,46 72,49 73.5,44.5 70,41.5 74.5,41.5" fill="url(#goldGrad)"/>
  <polygon points="124,37 125.5,41.5 130,41.5 126.5,44.5 128,49 124,46 120,49 121.5,44.5 118,41.5 122.5,41.5" fill="url(#goldGrad)"/>

  <!-- Laurel Wreath -->
  <path d="M 52 100 C 48 130 70 160 100 172 C 130 160 152 130 148 100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
